[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setu"
version = "1.0.0"
description = "Find the worst legal IRC:6 vehicle placement on a bridge deck."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "openseespy==3.8.0.0",
    "xarray==2026.7.0",
    "scipy==1.18.1",
    "flask==3.1.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.setuptools.packages.find]
where = ["."]
include = ["setu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
