[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setu"
version = "1.0.0"
description = "Find the worst legal IRC:6 vehicle placement on a bridge deck."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "openseespy==3.8.0.0",
    "matplotlib==3.11.1",
    "plotly>=5.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
