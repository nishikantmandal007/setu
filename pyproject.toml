[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setu"
version = "1.0.0"
description = "Find the worst legal IRC:6 vehicle placement on a bridge deck."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.2",
    "openseespy==3.8.0.0",
    "xarray>=2026.7.0",
    "scipy>=1.18.1",
    "numba>=0.68.1",
]

# The web app, tests and docs live only in a clone of the repository: `uv sync` there installs these groups; `pip install setu`
# installs the analysis package and its four dependencies alone.
[dependency-groups]
dev = ["pytest==9.1.1"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]
web = ["flask==3.1.3"]

[tool.uv]
default-groups = ["dev", "docs", "web"]

[tool.setuptools.packages.find]
where = ["."]
include = ["setu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# the web app and its tests import model/, routes and controller from web/ (tests put it on sys.path)
[tool.pyright]
extraPaths = ["web"]
