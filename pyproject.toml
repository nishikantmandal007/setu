[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setu"
version = "1.0.0"
description = "Worst legal IRC:6 vehicle placement on a bridge deck, without an analysis per position."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
fe = ["openseespy>=3.5"]
dev = ["openseespy>=3.5", "pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["setu*"]

[tool.setuptools.package-data]
setu = ["py.typed"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
packages = ["setu"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
