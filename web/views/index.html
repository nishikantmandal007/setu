<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setu bridge check</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js" defer></script>
<script src="/shared/vehicles.js?v=clean-4"></script>
<link rel="stylesheet" href="/static/app.css?v=clean-4">
</head>
<body>
<header>
  <picture class="logo">
    <source media="(prefers-color-scheme: dark)" srcset="/shared/logo-dark.svg">
    <img src="/shared/logo.svg" alt="Setu">
  </picture>
</header>
<main>
  <section id="inputs" class="card">
    <div id="fields"></div>
    <div class="go">
      <button class="primary" id="analyse">Analyse</button>
      <div class="error" id="input-error"></div>
    </div>
  </section>
  <div id="out">
    <div class="card empty">
      <div class="welcome-copy">
        <h2>Explore your bridge</h2>
        <p>Enter the bridge details, then select <b>Analyse</b> to see its forces and deflections.</p>
      </div>
      <figure class="welcome-illustration">
      <svg class="welcome-scene" viewBox="0 0 1512 982" preserveAspectRatio="xMaxYMax meet" role="img" aria-labelledby="welcome-bridge-title welcome-bridge-desc">
        <title id="welcome-bridge-title">Osdag steel bridge illustration, adapted for Setu</title>
        <desc id="welcome-bridge-desc">Osdag’s detailed cantilever bridge artwork, softly blended into the page.</desc>
        <image class="welcome-artwork" href="/static/osdag-bridge.svg" width="1512" height="982"/>
      </svg>
      <figcaption class="welcome-credit">Illustration adapted from <a href="https://github.com/osdag-admin/Osdag/blob/dev/src/osdag_gui/resources/vectors/background_dark.svg" target="_blank" rel="noopener noreferrer">Osdag</a></figcaption>
      </figure>
    </div>
  </div>
</main>

<script src="/static/app.js?v=clean-4"></script>
</body>
</html>
