{% set name = "setu" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python >=3.11,<3.13
    - pip
    - setuptools >=68
  run:
    - python >=3.11,<3.13
    - numpy >=2.4.6
    - xarray >=2026.7.0
    - scipy >=1.17.1
    - openseespy >=3.7.0.3,<3.9
    - numba >=0.68.1

test:
  imports:
    - setu
