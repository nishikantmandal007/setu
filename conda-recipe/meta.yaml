{% set name = "setu" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv

requirements:
  host:
    - python >=3.12,<3.13
    - pip
    - setuptools >=68
  run:
    - python >=3.12,<3.13
    - numpy >=2.5.2
    - xarray >=2026.7.0
    - scipy >=1.18.1
    - openseespy ==3.8.0.0

test:
  imports:
    - setu
